services:

  app:
    build:
      context: ..
      dockerfile: docker-deploy/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Krakowskie Forum Organizacji Społecznych}
      APP_ENV: production
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:3402}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      SEED_CLASS: ${SEED_CLASS:-Database\Seeders\FederationDemoSeeder}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-biuro@krafos.pl}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Krakowskie Forum Organizacji Społecznych}
    volumes:
      - db_data:/var/www/html/database
      - storage_data:/var/www/html/storage/app/public
    restart: unless-stopped
    networks:
      - feer

  nginx:
    build:
      context: ..
      dockerfile: docker-deploy/nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-3402}:80"
    volumes:
      - storage_data:/var/www/html/storage/app/public:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - feer

volumes:
  db_data:
  storage_data:

networks:
  feer:
    driver: bridge
