services:

  app:
    build:
      context: ..
      dockerfile: docker-deploy/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-FEER CMS Demo}
      APP_ENV: production
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://cms-demo.feer.org.pl}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-demo@feer.org.pl}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-FEER Demo}
    volumes:
      - db_data:/var/www/html/database
      - storage_data:/var/www/html/storage/app/public
    restart: unless-stopped
    networks:
      - feer

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${HTTP_PORT:-3401}:80"
    volumes:
      - ..:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - feer

volumes:
  db_data:
  storage_data:

networks:
  feer:
    driver: bridge
